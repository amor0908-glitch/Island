<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="apple-touch-icon" sizes="180x180" href="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a6/Baseball_%28red_seams%29.svg/240px-Baseball_%28red_seams%29.svg.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8개 팀 야구 리그 기록실</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans KR -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
    /* 스크롤바 커스텀 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #e2e8f0;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 9999px;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- 상단 헤더 -->
  <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-30 border-b-4 border-amber-500">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-amber-500 text-slate-950 flex items-center justify-center font-black text-xl shadow-inner">
          ⚾
        </div>
        <div>
          <h1 id="leagueTitleDisplay" class="text-lg sm:text-xl font-extrabold tracking-tight leading-tight">
            2026 야구 리그 기록실
          </h1>
          <p class="text-xs text-slate-400">8개 팀(A/B조) 공식 순위 및 개인 누계 기록</p>
        </div>
      </div>

      <!-- 백업/복원/링크복사 -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <button onclick="navigator.clipboard.writeText(window.location.href); showToast('웹앱 주소가 복사되었습니다!');" class="bg-amber-500 text-slate-950 px-3 py-1.5 rounded-lg text-xs font-extrabold shadow hover:bg-amber-400 transition">
          🔗 링크 복사
        </button>
        <button onclick="exportData()" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-lg border border-slate-700 transition">
          💾 백업
        </button>
        <label class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-lg border border-slate-700 transition cursor-pointer">
          📂 복원
          <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importData(event)">
        </label>
      </div>
    </div>

    <!-- 네비게이션 탭 -->
    <nav class="bg-slate-800/90 border-t border-slate-700/80">
      <div class="max-w-6xl mx-auto px-2 flex overflow-x-auto no-scrollbar">
        <button type="button" onclick="switchTab('standings')" id="tab-standings" class="nav-btn active px-3.5 py-3 text-xs sm:text-sm font-bold whitespace-nowrap border-b-2 border-amber-400 text-amber-400 transition">
          🏆 팀 순위(A·B조) & 경기결과
        </button>
        <button type="button" onclick="switchTab('batters')" id="tab-batters" class="nav-btn px-3.5 py-3 text-xs sm:text-sm font-bold whitespace-nowrap border-b-2 border-transparent text-slate-300 hover:text-white transition">
          🏏 타자 기록 
        </button>
        <button type="button" onclick="switchTab('pitchers')" id="tab-pitchers" class="nav-btn px-3.5 py-3 text-xs sm:text-sm font-bold whitespace-nowrap border-b-2 border-transparent text-slate-300 hover:text-white transition">
          ⚾ 투수 기록 
        </button>
        <button type="button" onclick="switchTab('recorder')" id="tab-recorder" class="nav-btn px-3.5 py-3 text-xs sm:text-sm font-bold whitespace-nowrap border-b-2 border-transparent text-slate-300 hover:text-white transition">
          🔒 ✍️ 기록 입력 (기록원)
        </button>
        <button type="button" onclick="switchTab('teams')" id="tab-teams" class="nav-btn px-3.5 py-3 text-xs sm:text-sm font-bold whitespace-nowrap border-b-2 border-transparent text-slate-300 hover:text-white transition">
          🔒 ⚙️ 팀/선수 관리
        </button>
      </div>
    </nav>
  </header>

  <!-- 토스트 알림 -->
  <div id="toastBox" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300 opacity-0 translate-y-4">
    <div id="toastMessage" class="bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl border border-slate-700 text-sm font-semibold flex items-center gap-2">
    </div>
  </div>

  <!-- 비밀번호 인증 모달 -->
  <div id="passwordModal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 space-y-4">
      <div class="text-center space-y-1">
        <div class="w-12 h-12 bg-amber-100 text-amber-700 rounded-2xl mx-auto flex items-center justify-center text-xl font-black mb-2">🔒</div>
        <h3 class="text-lg font-extrabold text-slate-900">비밀번호 인증 필요</h3>
        <p class="text-xs text-slate-500">기록원 메뉴에 접근하려면 비밀번호를 입력하세요.<br></p>
      </div>
      <form onsubmit="verifyPassword(event)" class="space-y-3">
        <input type="password" id="accessPasswordInput" placeholder="비밀번호 입력" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-center text-lg font-bold tracking-widest focus:outline-none focus:ring-2 focus:ring-amber-500">
        <div class="flex gap-2 pt-1">
          <button type="button" onclick="closePasswordModal()" class="flex-1 px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-bold transition">
            취소
          </button>
          <button type="submit" class="flex-1 px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-amber-400 text-sm font-extrabold transition">
            확인
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 커스텀 확인 모달 -->
  <div id="confirmModal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-200">
      <h3 id="confirmTitle" class="text-lg font-extrabold text-slate-900 mb-2">확인</h3>
      <p id="confirmDesc" class="text-sm text-slate-600 mb-6 leading-relaxed"></p>
      <div class="flex justify-end gap-2">
        <button type="button" id="confirmCancelBtn" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-bold transition">
          취소
        </button>
        <button type="button" id="confirmOkBtn" class="px-4 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-sm font-bold transition">
          확인
        </button>
      </div>
    </div>
  </div>

  <!-- 메인 콘텐츠 영역 -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-3 sm:px-4 py-5 space-y-6">

    <!-- 1. 팀 순위 & 경기 결과 탭 -->
    <section id="view-standings" class="space-y-6">
      <!-- 조별 순위표 상단 컨트롤 -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="p-4 sm:p-5 bg-slate-900 text-white flex flex-wrap items-center justify-between gap-3">
          <div>
            <h2 class="text-base sm:text-lg font-extrabold flex items-center gap-2">
              <span class="text-amber-400">🏆</span> A조 · B조 정규 순위표
            </h2>
            <p class="text-xs text-slate-400 mt-0.5">각 조별 상위 4개 팀 순위 및 기록이 자동 반영됩니다.</p>
          </div>
          <div class="flex items-center bg-slate-800 p-1 rounded-xl border border-slate-700 text-xs">
            <button type="button" onclick="setStandingMode('winPct')" id="btnModeWinPct" class="px-3 py-1.5 rounded-lg font-bold bg-amber-500 text-slate-950 transition">승률순</button>
            <button type="button" onclick="setStandingMode('points')" id="btnModePoints" class="px-3 py-1.5 rounded-lg font-bold text-slate-300 hover:text-white transition">승점순 (3/1/0)</button>
          </div>
        </div>

        <!-- A조 순위 테이블 -->
        <div class="p-4 sm:p-5 pb-2 border-b border-slate-100 bg-slate-50/50 flex items-center justify-between">
          <h3 class="font-extrabold text-slate-900 text-sm sm:text-base flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-blue-600 inline-block"></span> A조 순위
          </h3>
          <span class="text-xs text-slate-500">1~4팀</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse tabular-nums">
            <thead>
              <tr class="bg-slate-100 text-slate-600 text-xs font-extrabold uppercase border-b border-slate-20
